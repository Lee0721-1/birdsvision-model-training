name: Bug report
description: Report a reproducible defect without private data
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: Describe the observed and expected behavior.}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction, description: Provide a synthetic minimal reproduction.}
    validations: {required: true}
